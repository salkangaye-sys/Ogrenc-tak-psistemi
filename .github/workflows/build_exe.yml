name: Coklu Platform Derleyici (Windows & Pardus/Linux)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: OgrenciTakipSistemi-Windows-EXE
            output_file: dist/app.exe
          - os: ubuntu-22.04
            artifact_name: OgrenciTakipSistemi-Pardus-Linux
            output_file: dist/app

    steps:
    - uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Linux / Pardus Bağımlılıklarını Kur (Sadece Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          python3-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.0-dev

    - name: Python Kütüphanelerini Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Uygulamayı Derle (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --add-data "templates;templates" app.py

    - name: Uygulamayı Derle (Pardus / Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --noconfirm --onefile --windowed --add-data "templates:templates" app.py

    - name: Derlenen Çıktıyı Yükle
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.output_file }}
